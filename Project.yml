name: MoneyMate
options:
  bundleIdPrefix: com.moneymate
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
targets:
  MoneyMate:
    type: application
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - MoneyMate
    dependencies:
      - target: MoneyMateWidget
    info:
      path: Config/MoneyMate-Info.plist
      properties:
        CFBundleDisplayName: MoneyMate
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSFaceIDUsageDescription: 用于解锁你的账本
        NSLocationWhenInUseUsageDescription: 用于记录每笔账发生的地点，方便日后回看
        NSCameraUsageDescription: 用于拍摄小票并自动识别金额与商户
        ITSAppUsesNonExemptEncryption: false
        CFBundleURLTypes:
          - CFBundleURLName: com.moneymate.app
            CFBundleURLSchemes:
              - moneymate
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.moneymate.app
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_CFBundleDisplayName: MoneyMate
        INFOPLIST_KEY_NSFaceIDUsageDescription: 用于解锁你的账本
        INFOPLIST_KEY_NSLocationWhenInUseUsageDescription: 用于记录每笔账发生的地点，方便日后回看
        TARGETED_DEVICE_FAMILY: "1"
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0"
  MoneyMateWidget:
    type: app-extension
    platform: iOS
    deploymentTarget: "26.0"
    sources:
      - MoneyMateWidget
      - path: MoneyMate/Shared/WidgetShared.swift
    info:
      path: Config/MoneyMateWidget-Info.plist
      properties:
        CFBundleDisplayName: MoneyMate 小组件
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.moneymate.app.widget
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
        CURRENT_PROJECT_VERSION: "1"
        MARKETING_VERSION: "1.0"
